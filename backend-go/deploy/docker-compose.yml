services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quant_system}
      MYSQL_USER: ${MYSQL_USER:-quant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quant_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quant-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quant-net

  etcd:
    image: registry.k8s.io/etcd:3.6.11-0
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=quant-etcd
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    networks:
      - quant-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - quant-net

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - quant-net

  quant-python:
    build:
      context: ../../quant-python
      dockerfile: Dockerfile
    environment:
      DATA_MODE: ${DATA_MODE:-mock}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - quant-net

  gateway-api:
    image: golang:1.24-alpine
    working_dir: /workspace/backend-go
    command: ["go", "run", "./apps/gateway-api/gateway.go", "-f", "./apps/gateway-api/etc/gateway-api.yaml"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quant_system}
      MYSQL_USER: ${MYSQL_USER:-quant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quant_password}
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
      GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
      JWT_SECRET: ${JWT_SECRET:-quant-system-dev-secret}
    volumes:
      - ../:/workspace/backend-go
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    depends_on:
      - etcd
      - user-rpc
      - market-rpc
      - strategy-rpc
      - backtest-rpc
      - risk-rpc
      - paper-rpc
      - rag-rpc
      - agent-rpc
      - task-rpc
      - notify-rpc
    networks:
      - quant-net

  user-rpc:
    image: golang:1.24-alpine
    working_dir: /workspace/backend-go
