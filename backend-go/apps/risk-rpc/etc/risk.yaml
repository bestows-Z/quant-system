Name: risk-rpc.rpc
ListenOn: 0.0.0.0:9006
Etcd:
  Hosts:
    - etcd:2379
  Key: risk-rpc.rpc
MySQL:
  DSN: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=Local
CacheRedis:
  Host: redis:6379
  Type: node
  Pass: ""
RabbitMQ:
  Url: amqp://guest:guest@rabbitmq:5672/
  Exchange: quant.events
MarketRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: market-rpc.rpc
PaperRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: paper-rpc.rpc
StrategyRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: strategy-rpc.rpc
BacktestRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: backtest-rpc.rpc
AppLog:
  Level: info
