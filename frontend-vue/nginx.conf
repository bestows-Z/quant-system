log_format quant_sanitized '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent request_time=$request_time ua="$http_user_agent"';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log quant_sanitized;

  # Docker service IPs change after container recreation. Resolve upstreams at
  # request time so Nginx does not keep forwarding to a stale container IP.
  resolver 127.0.0.11 valid=5s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $gateway_upstream gateway-api:8080;
    proxy_pass http://$gateway_upstream;
    proxy_connect_timeout 3s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    set $ws_upstream ws-api:8081;
    proxy_pass http://$ws_upstream;
    proxy_connect_timeout 3s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location @api_unavailable {
    default_type application/json;
    return 503 '{"code":503,"message":"服务正在启动或暂时不可用，请稍后重试","data":{},"trace_id":"nginx-upstream"}';
  }

  error_page 502 503 504 = @api_unavailable;
}
