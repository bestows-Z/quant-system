app:
  name: quant-python
  env: local
  host: 0.0.0.0
  port: 8000
  data_mode: mock

mysql:
  host: mysql
  port: 3306
  database: quant_system
  username: quant
  password: quant_password

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

data_sources:
  realtime_priority:
    - akshare
    - efinance
  history_priority:
    - akshare
    - baostock
    - tushare
  tushare_token: ""
  akshare_timeout_seconds: 20

scheduler:
  enable: true
  realtime_quote_cron: "*/30 * * * * *"
  daily_bar_cron: "0 30 17 * * 1-5"

indicators:
  ma_windows:
    - 5
    - 10
    - 20
    - 60
  rsi_period: 14
  boll_period: 20
  boll_std: 2
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

